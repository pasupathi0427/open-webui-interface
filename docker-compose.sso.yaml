services:
  # CUSTOM (MASS-GPT): app database. Open WebUI uses it when DATABASE_URL points here
  # (see docs/POSTGRES_MIGRATION.md). Published on the host loopback only, for psql/pg_dump.
  postgres:
    # bookworm (Debian 12) keeps legacy timezone names such as Asia/Calcutta, which Java clients
    # (DBeaver, JDBC) send; the default Debian 13 image rejects them.
    image: postgres:16-bookworm
    container_name: open-webui-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openwebui}
      - POSTGRES_USER=${POSTGRES_USER:-openwebui}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - owui-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # CUSTOM (MASS-GPT): file storage, off for now. To use it, uncomment this service, the
  # owui-minio volume, the S3 lines under open-webui, and the MinIO block in .env.
  # minio:
  #   image: minio/minio:latest
  #   container_name: open-webui-minio
  #   command: server /data --console-address ':9001'
  #   environment:
  #     - MINIO_ROOT_USER=${MINIO_ROOT_USER}
  #     - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
  #   volumes:
  #     - owui-minio:/data
  #   restart: unless-stopped

  # CUSTOM (MASS-GPT): Redis, off for now. Needed before running more than one worker or
  # replica. To use it, uncomment this service, the owui-redis volume, the Redis lines
  # under open-webui, and the Redis block in .env.
  # redis:
  #   image: redis:7-alpine
  #   container_name: open-webui-redis
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - owui-redis:/data
  #   restart: unless-stopped

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      # Still needed with Postgres: uploads, vector_db (Chroma), cache, and webui.db as the fallback.
      - open-webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      # CUSTOM (MASS-GPT): app database. Defaults to the SQLite file until .env sets DATABASE_URL.
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/backend/data/webui.db}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_POOL_MAX_OVERFLOW=${DATABASE_POOL_MAX_OVERFLOW:-10}
      # CUSTOM (MASS-GPT): tool credentials export, off while empty (docs/TOOL_CREDENTIALS_EXPORT.md).
      - TOOL_CREDENTIALS_EXPORT=${TOOL_CREDENTIALS_EXPORT:-}
      - TOOL_CREDENTIALS_EXPORT_KEY=${TOOL_CREDENTIALS_EXPORT_KEY:-}
      # CUSTOM (MASS-GPT): MinIO file storage, off for now.
      # - STORAGE_PROVIDER=s3
      # - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      # - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      # - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      # - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      # - S3_REGION_NAME=${S3_REGION_NAME}
      # - S3_ADDRESSING_STYLE=path
      # CUSTOM (MASS-GPT): Redis, off for now.
      # - REDIS_URL=${REDIS_URL}
      # - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-open-webui}
      # - WEBSOCKET_MANAGER=redis
      - ENABLE_API_KEYS=${ENABLE_API_KEYS}
      - ENABLE_FORWARD_USER_INFO_HEADERS=${ENABLE_FORWARD_USER_INFO_HEADERS}
      - ENABLE_OWRF_SYNC=${ENABLE_OWRF_SYNC:-false}
      - OWRF_SYNC_EVENT_URL=${OWRF_SYNC_EVENT_URL}
      - OWRF_SYNC_EVENT_SECRET=${OWRF_SYNC_EVENT_SECRET}
      - ENABLE_RAG_LOCAL_WEB_FETCH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=${WEBUI_URL}
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID}
      - MICROSOFT_REDIRECT_URI=${WEBUI_URL}/oauth/microsoft/callback
      - OPENID_PROVIDER_URL=https://login.microsoftonline.com/${MICROSOFT_CLIENT_TENANT_ID}/v2.0/.well-known/openid-configuration
      - MICROSOFT_OAUTH_SCOPE=openid email profile offline_access User.Read
      - ENABLE_MICROSOFT_GRAPH_GROUP_CLAIM=true
      - ENABLE_OAUTH_PERSISTENT_CONFIG=true
      - ENABLE_OAUTH_GROUP_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_CREATION=true
      - OAUTH_GROUP_CLAIM=department
      - OAUTH_GROUP_DEFAULT_SHARE=members
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
  owui-postgres: {}
  # owui-minio: {}
  # owui-redis: {}
